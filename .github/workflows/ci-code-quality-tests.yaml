name: CI quality gates

on:
  push:
    branches: [main, dev, portfolio-stabilization, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  frontend:
    name: Frontend types, lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: invoice-frontend
    env:
      VITE_BACKEND_URL: http://localhost:8000
      VITE_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-frontend-${{ hashFiles('invoice-frontend/yarn.lock') }}
      - run: corepack yarn install --immutable
      - run: npm run check
      - run: npm run typecheck:e2e

  backend:
    name: Backend types, lint, unit, integration and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: invoice-backend
    env:
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/invoice_ci
      NODE_ENV: test
      DEMO_MODE: 'false'
      DOMAIN: ''
      AUDIENCE: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: invoice_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d invoice_ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-backend-${{ hashFiles('invoice-backend/yarn.lock') }}
      - run: corepack yarn install --immutable
      - run: npm run prisma-generate
      - run: npm run check
      # Applies committed migrations before serial tests. No production secrets.
      - run: npm run test:integration

  browser:
    name: Real backend Chromium desktop, mobile and Demo-disabled
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-browser-${{ hashFiles('invoice-backend/yarn.lock', 'invoice-frontend/yarn.lock') }}
      - run: corepack yarn install --immutable
        working-directory: invoice-backend
      - run: corepack yarn install --immutable
        working-directory: invoice-frontend
      - name: Install disposable database and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          node invoice-frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm --prefix invoice-frontend run test:e2e
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-browser-results
          retention-days: 7
          path: |
            ${{ runner.temp }}/invoice-e2e-*/*.log
            ${{ runner.temp }}/invoice-e2e-*/results.json
            ${{ runner.temp }}/invoice-e2e-*/results/**
            ${{ runner.temp }}/invoice-e2e-*/playwright-report/**

  containers:
    name: Production images and fresh Compose startup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker compose -p invoice-ci config --quiet
      - run: docker compose -p invoice-ci up -d --build --wait --wait-timeout 180
      - name: Check compiled API and static application
        run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:5173/invoice-web-app/
          curl --fail -H 'Content-Type: application/json' --data '{"query":"{ __typename }"}' http://localhost:8000/ | python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["__typename"] == "Query"'
      - if: failure()
        run: docker compose -p invoice-ci logs
      - if: always()
        run: docker compose -p invoice-ci down --volumes
