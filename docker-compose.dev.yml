# Standalone HTTPS development stack; certificates and Auth0 are operator supplied.
services:
  frontend-dev:
    build:
      context: invoice-frontend
      dockerfile: dev.Dockerfile
    env_file: invoice-frontend/.env
    environment:
      VITE_BACKEND_URL: https://localhost:8000
      VITE_DEMO_MODE: "false"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./invoice-frontend/src:/usr/src/app/src
      - ./invoice-frontend/certs:/usr/src/app/certs:ro
    depends_on:
      backend-dev:
        condition: service_healthy
  backend-dev:
    build:
      context: invoice-backend
      dockerfile: dev.Dockerfile
    env_file: invoice-backend/.env
    environment:
      NODE_ENV: development
      DEMO_MODE: "false"
      PORT: 8000
      CERT_DIR: ../certs
      CORS_ORIGIN: https://localhost:5173
      DATABASE_URL: postgresql://postgres:local-only@db-dev:5432/invoices_dev
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./invoice-backend/src:/usr/src/app/src
      - ./invoice-backend/prisma:/usr/src/app/prisma
      - ./invoice-backend/certs:/usr/src/app/certs:ro
    depends_on:
      db-dev:
        condition: service_healthy
    healthcheck:
      # Local mkcert is self-signed in the container; validation bypass is confined to this development probe.
      test: ["CMD", "node", "-e", "require('https').get('https://127.0.0.1:8000/health',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
  db-dev:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: invoices_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoices_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata-dev:
