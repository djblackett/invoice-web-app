# Local production-like stack. Demo is disabled unless explicitly overridden.
services:
  frontend:
    build:
      context: invoice-frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_DOMAIN: ${VITE_DOMAIN:-}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:-}
        VITE_AUDIENCE: ${VITE_AUDIENCE:-}
        VITE_SCOPE: ${VITE_SCOPE:-}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build: invoice-backend
    environment:
      NODE_ENV: production
      PORT: 8000
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://postgres:local-only@db:5432/invoices
      DOMAIN: ${DOMAIN:-}
      AUDIENCE: ${AUDIENCE:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: invoices
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoices"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
