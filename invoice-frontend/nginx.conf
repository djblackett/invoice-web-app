server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = / { return 302 /invoice-web-app/; }
    location = /invoice-web-app { return 301 /invoice-web-app/; }
    location /invoice-web-app/assets/ { try_files $uri =404; }
    location /invoice-web-app/ { try_files $uri $uri/ /invoice-web-app/index.html; }
}
